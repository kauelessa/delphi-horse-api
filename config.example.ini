; Copie este arquivo para "config.ini" na mesma pasta do executável
; e ajuste os valores. O config.ini não é versionado.

[Servidor]
Porta=9000

[Banco]
Servidor=localhost
Porta=3050
; Caminho do arquivo .fdb no servidor Firebird (ou alias definido no databases.conf)
Arquivo=DELPHI_HORSE_API
Usuario=SYSDBA
Senha=
; Opcional: caminho da fbclient.dll. Em branco usa a biblioteca padrão do sistema.
BibliotecaCliente=

[Migracao]
; Cria o banco (arquivo .fdb no servidor) se ele ainda não existir, com charset UTF8.
; A pasta precisa existir e o usuário precisa poder criar bancos. Desligue em
; produção: um caminho errado criaria um banco vazio em vez de dar erro.
CriarBanco=0
; Aplica na subida da API os scripts de database/ que ainda não rodaram
; (controle na tabela SCHEMA_VERSAO). O banco precisa existir ou CriarBanco=1.
Executar=1
; Scripts *_seed_* (usuário admin/admin123 e dados de exemplo).
; Ligue só em desenvolvimento.
ExecutarSeeds=0
; Pasta dos scripts, absoluta ou relativa à pasta do executável.
Pasta=database

[JWT]
; Segredo usado para assinar os tokens (HS256). Mínimo de 32 caracteres.
; Gere um valor aleatório, por exemplo: openssl rand -base64 48
Segredo=
Emissor=delphi-horse-api
ExpiracaoMinutos=60
; Validade do refresh token (dias). Cada renovação troca o token e reinicia o prazo.
RefreshDias=30
